name: QuanZu Rain V2 FAST
on:
  push:
    branches: [ quanzu-rain-v2-fast ]
    paths:
      - 'QuanZuRainV2/**'
      - '.github/workflows/quanzu_rain_v2.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m compileall -q QuanZuRainV2
      - name: Unit tests
        working-directory: QuanZuRainV2
        run: python -m unittest discover -s tests -v

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build GUI EXE
        working-directory: QuanZuRainV2
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name QuanZuRainV2 app.py
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\QuanZuRainV2.exe package\QuanZuRainV2.exe
          Copy-Item README.md package\README.md
      - name: Bundle FFmpeg essentials
        working-directory: QuanZuRainV2
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_pkg
          $bin = Get-ChildItem ffmpeg_pkg -Recurse -Directory | Where-Object { $_.Name -eq 'bin' } | Select-Object -First 1
          if (-not $bin) { throw 'Không tìm thấy thư mục bin trong FFmpeg package' }
          Copy-Item (Join-Path $bin.FullName 'ffmpeg.exe') package\ffmpeg.exe
          Copy-Item (Join-Path $bin.FullName 'ffprobe.exe') package\ffprobe.exe
      - name: Source ZIP
        working-directory: QuanZuRainV2
        shell: pwsh
        run: Compress-Archive -Path app.py,rainloop,tests,README.md,requirements.txt,run_windows.bat -DestinationPath package\QuanZuRainV2_Source_V2.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: QuanZuRainV2_FAST_Windows
          path: QuanZuRainV2/package/
          if-no-files-found: error