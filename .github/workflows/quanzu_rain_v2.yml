name: QuanZu Rain V2.2 FAST

on:
  push:
    branches: [ quanzu-rain-v2-fast ]
    paths:
      - 'QuanZuRainV2_B64/**'
      - 'QuanZuRainV2_V2.2.patch'
      - '.github/workflows/quanzu_rain_v2.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Rebuild V2.2 source
        run: |
          cat QuanZuRainV2_B64/part*.txt | tr -d '\r\n' | base64 -d > QuanZuRainV2_Source_V2.1.zip
          echo "93b8c9d8c7bc01f10bfca9284cfd9fa33b6bbfc0c0a5e400044ab3e7ee18e180  QuanZuRainV2_Source_V2.1.zip" | sha256sum -c -
          mkdir src
          unzip -q QuanZuRainV2_Source_V2.1.zip -d src
          python - <<'PY'
          from pathlib import Path
          p = Path('src/tests/test_engine.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("self.assertEqual(str(Path(p).parent), '/tmp/render out')", "self.assertEqual(Path(p).parent, Path('/tmp/render out'))")
          p.write_text(s, encoding='utf-8')
          PY
          cd src
          git apply --unsafe-paths -p2 ../QuanZuRainV2_V2.2.patch

      - name: Syntax
        run: python -m compileall -q src

      - name: Unit + FFmpeg integration tests
        working-directory: src
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  windows-build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild V2.2 source
        shell: pwsh
        run: |
          $b64 = (Get-ChildItem QuanZuRainV2_B64\part*.txt | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('QuanZuRainV2_Source_V2.1.zip',[Convert]::FromBase64String($b64))
          $hash = (Get-FileHash QuanZuRainV2_Source_V2.1.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '93b8c9d8c7bc01f10bfca9284cfd9fa33b6bbfc0c0a5e400044ab3e7ee18e180') { throw "Source SHA256 mismatch: $hash" }
          Expand-Archive -Path QuanZuRainV2_Source_V2.1.zip -DestinationPath src
          python -c "from pathlib import Path; p=Path('src/tests/test_engine.py'); s=p.read_text(encoding='utf-8'); s=s.replace(\"self.assertEqual(str(Path(p).parent), '/tmp/render out')\", \"self.assertEqual(Path(p).parent, Path('/tmp/render out'))\"); p.write_text(s, encoding='utf-8')"
          Push-Location src
          git apply --unsafe-paths -p2 ../QuanZuRainV2_V2.2.patch
          Pop-Location

      - name: Prepare FFmpeg for Windows tests
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_pkg
          $bin = Get-ChildItem ffmpeg_pkg -Recurse -Directory | Where-Object { $_.Name -eq 'bin' } | Select-Object -First 1
          if (-not $bin) { throw 'Không tìm thấy thư mục bin trong FFmpeg package' }
          "FFMPEG_BIN=$($bin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $bin.FullName | Out-File -FilePath $env:GITHUB_PATH -Append
          & (Join-Path $bin.FullName 'ffmpeg.exe') -version | Select-Object -First 1
          & (Join-Path $bin.FullName 'ffprobe.exe') -version | Select-Object -First 1

      - name: Windows unit + FFmpeg integration tests
        working-directory: src
        shell: pwsh
        run: |
          python -m compileall -q .
          python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Build GUI EXE
        working-directory: src
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name QuanZuRainV2_2 app.py
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\QuanZuRainV2_2.exe package\QuanZuRainV2_2.exe
          Copy-Item README.md package\README.md
          Compress-Archive -Path app.py,rainloop,tests,README.md,requirements.txt,run_windows.bat -DestinationPath package\QuanZuRainV2_Source_V2.2.zip -Force

      - name: Bundle FFmpeg essentials
        working-directory: src
        shell: pwsh
        run: |
          Copy-Item (Join-Path $env:FFMPEG_BIN 'ffmpeg.exe') package\ffmpeg.exe
          Copy-Item (Join-Path $env:FFMPEG_BIN 'ffprobe.exe') package\ffprobe.exe
          & package\ffmpeg.exe -version | Select-Object -First 1
          & package\ffprobe.exe -version | Select-Object -First 1

      - name: Verify package
        working-directory: src
        shell: pwsh
        run: |
          @('QuanZuRainV2_2.exe','ffmpeg.exe','ffprobe.exe','QuanZuRainV2_Source_V2.2.zip','README.md') | ForEach-Object {
            if (-not (Test-Path (Join-Path 'package' $_))) { throw "Missing package file: $_" }
          }
          Get-ChildItem package | Select-Object Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: QuanZuRainV2_2_FAST_Windows
          path: src/package/
          if-no-files-found: error
