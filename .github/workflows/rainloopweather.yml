name: RainLoopWeather CI
on:
  push:
    branches: [ rain-loop-weather-v1 ]
    paths:
      - 'RainLoopWeather_Source_V1.zip'
      - '.github/workflows/rainloopweather.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir src && unzip -q RainLoopWeather_Source_V1.zip -d src
      - run: python -m compileall -q src
      - working-directory: src
        run: python -m unittest discover -s tests -v

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: Expand-Archive -Path RainLoopWeather_Source_V1.zip -DestinationPath src
      - working-directory: src
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name RainLoopWeather app.py
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\RainLoopWeather.exe package\RainLoopWeather.exe
          Copy-Item README.md package\README.md
          Copy-Item install_ffmpeg_windows.bat package\install_ffmpeg_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: RainLoopWeather_V1_Windows
          path: src/package/

# trigger public build
